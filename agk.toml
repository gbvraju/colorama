# agk configuration (adopted repository). Read by the checks.
mode = "adopt"
version = "0.4.0"
installed = "2026-10-14"
default_branch = "master"
test_dirs = ["colorama/tests"]
test_patterns = ["*_test.py"]
lint_paths = ["scripts/agk", "tests/kit", ".claude/hooks"]
